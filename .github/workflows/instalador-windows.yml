# Crea el instalador de Windows (SistemaHotel-2.0.0.exe) en la nube de GitHub, sin necesitar una PC con Windows.
name: Instalador Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar
        shell: pwsh
        run: mvn -B -DskipTests "-Djavafx.platform=win" clean package
      - name: Preparar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app | Out-Null
          Copy-Item target/sistema-hotel-2.0.0.jar app/sistema-hotel.jar
      - name: Instalar WiX si falta
        shell: pwsh
        run: |
          if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
            $w = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($w) { $w.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH } else { choco install wixtoolset -y --no-progress }
          }
      - name: Crear instalador
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { $env:PATH = "$($wix.FullName);$env:PATH" }
          jpackage --type exe --name SistemaHotel --app-version 2.0.0 --vendor "Sistema Hotel" --description "Sistema de hotel y restaurante" `
            --input app --main-jar sistema-hotel.jar --main-class hn.hotel.app.Main --dest salida `
            --win-menu --win-shortcut --win-dir-chooser
      - uses: actions/upload-artifact@v4
        with:
          name: SistemaHotel-instalador-windows
          path: salida/*.exe
